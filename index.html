<style>

}

/* ---------- Couvertures originales (SVG) ---------- */
function wrap(text,max){
  const words=text.split(" "),lines=[];let cur="";
  for(const w of words){
    if(!cur){cur=w}else if((cur+" "+w).length<=max){cur+=" "+w}else{lines.push(cur);cur=w}
  }
  if(cur)lines.push(cur);
  return lines.slice(0,6);
}
function cover(b,ed){
  const real=COVERS[b.en]||COVERS[b.id];
  if(real)return `<img src="${esc(real)}" alt="${esc(titleOf(b,ed))}" loading="lazy" style="display:block;width:100%;aspect-ratio:2/3;object-fit:cover">`;
  const c=catOf(b.cat),[bg,ink,ac]=c.p,h=hash(b.fr);
  const title=titleOf(b,ed);
  const lines=wrap(title,title.length>40?15:13);
  const maxlen=Math.max(...lines.map(l=>l.length));
  let size=lines.length<=2?24:lines.length===3?21:lines.length===4?18:15;
  size=Math.min(size,160/(maxlen*0.57));
  const lh=size*1.16, y0=176;
  const tspans=lines.map((l,i)=>`<tspan x="18" y="${(y0+i*lh).toFixed(1)}">${esc(l)}</tspan>`).join("");
  const m=h%6;let art="";
  if(m===0)art=`<circle cx="140" cy="72" r="52" fill="${ac}"/><circle cx="140" cy="72" r="30" fill="${bg}"/>`;
  else if(m===1)art=[0,1,2,3,4,5].map(i=>`<rect x="0" y="${30+i*20}" width="${200-i*26}" height="9" fill="${ac}" opacity="${(1-i*0.13).toFixed(2)}"/>`).join("");
  else if(m===2)art=Array.from({length:9},(_,i)=>`<path d="M${-40+i*34} 150L${40+i*34} 0" stroke="${ac}" stroke-width="7" opacity="${i%2?0.45:0.95}"/>`).join("");
  else if(m===3)art=[60,46,32,18].map((r,i)=>`<path d="M${100-r} 140A${r} ${r} 0 0 1 ${100+r} 140" fill="none" stroke="${i%2?ink:ac}" stroke-width="7" opacity="${i%2?0.55:1}"/>`).join("")+`<rect x="0" y="140" width="200" height="4" fill="${ac}"/>`;
  else if(m===4){let d="";for(let r=0;r<6;r++)for(let q=0;q<9;q++)d+=`<circle cx="${20+q*20}" cy="${22+r*20}" r="${(q+r)%3===0?5.5:2.6}" fill="${ac}" opacity="${(q+r)%3===0?1:.6}"/>`;art=d}
  else art=`<path d="M0 150L56 62L92 112L132 38L200 150Z" fill="${ac}"/><path d="M0 150L56 62L92 112L0 150Z" fill="${ink}" opacity=".22"/><circle cx="160" cy="26" r="11" fill="${ink}" opacity=".85"/>`;
  const au=esc(b.au.length>34?b.au.slice(0,33)+"…":b.au).toUpperCase();
  return `<svg data-book-id="${b.id}" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(title)}"><rect width="200" height="300" fill="${bg}"/>${art}<rect x="0" y="0" width="7" height="300" fill="#000" opacity=".16"/><text font-family="'Bricolage Grotesque','Trebuchet MS',sans-serif" font-weight="800" font-size="${size.toFixed(1)}" fill="${ink}">${tspans}</text><text x="18" y="283" font-family="'Instrument Sans',sans-serif" font-weight="600" font-size="8.6" letter-spacing="1.1" fill="${ac}">${au}</text></svg>`;
}
function spine(b){
  const c=catOf(b.cat),[bg,ink,ac]=c.p,h=hash(b.fr);
  const w=30+(h%5)*4, ht=150+(h>>3)%60;
  return `<button type="button" class="spine" data-open="${b.id}" title="${esc(titleOf(b))}" style="width:${w}px;height:${ht}px;background:${bg};color:${ink}"><em style="background:${ac}"></em><span>${esc(titleOf(b))}</span></button>`;
}

/* Couvertures réelles : recherche automatique dans Open Library (titre + auteur), avec repli sur la couverture dessinée.
   Les résultats sont gardés dans le navigateur pour ne pas refaire les requêtes à chaque visite. */
const COVER_CACHE = (()=>{try{return JSON.parse(localStorage.getItem("ol_covers_v2")||"{}")}catch(e){return {}}})();
const COVER_PENDING = {}, COVER_QUEUE = [];
let COVER_BUSY = 0;
const GENERIC_AUTHOR = /récits|vulgarisation|plusieurs|classiques|documentaires/i;
function saveCovers(){try{localStorage.setItem("ol_covers_v2",JSON.stringify(COVER_CACHE))}catch(e){}}
async function olSearch(params){
  const r=await fetch("https://openlibrary.org/search.json?"+new URLSearchParams({...params,limit:"8",fields:"title,cover_i"}));
  if(!r.ok)throw new Error("http "+r.status);
  return (await r.json()).docs||[];
}
async function findCover(b){
  if(GENERIC_AUTHOR.test(b.au))return 0;
  const nt=norm(b.en), first=b.au.split(/ & |,/)[0].trim();
  let hit=(await olSearch({title:b.en,author:first})).find(d=>d.cover_i&&norm(d.title||"")&&(norm(d.title).includes(nt)||nt.includes(norm(d.title))));
  if(!hit)hit=(await olSearch({title:b.en})).find(d=>d.cover_i&&norm(d.title||"")===nt);
  return hit?`https://covers.openlibrary.org/b/id/${hit.cover_i}-L.jpg?default=false`:0;
}
function applyCover(id){
  const url=COVER_CACHE[id]; if(!url)return;
  document.querySelectorAll(`svg[data-book-id="${id}"]`).forEach(svg=>{
    const img=document.createElement("img");
    img.src=url; img.alt=svg.getAttribute("aria-label")||"Couverture du livre";
    img.loading="lazy"; img.referrerPolicy="no-referrer";
    img.onerror=()=>{COVER_CACHE[id]=0;saveCovers();img.replaceWith(svg)};
    svg.replaceWith(img);
  });
}
function pumpCovers(){
  while(COVER_BUSY<4&&COVER_QUEUE.length){
    const b=COVER_QUEUE.shift(); COVER_BUSY++;
    findCover(b).then(u=>{COVER_CACHE[b.id]=u;saveCovers()},()=>{}).finally(()=>{COVER_BUSY--;applyCover(b.id);pumpCovers()});
  }
}
function loadRealCovers(){
  const ids=[...new Set([...document.querySelectorAll("svg[data-book-id]")].map(n=>+n.dataset.bookId).filter(Boolean))];
  ids.forEach(id=>{
    if(id in COVER_CACHE){applyCover(id);return}
    if(COVER_PENDING[id])return;
    COVER_PENDING[id]=1;
    const b=BOOKS.find(x=>x.id===id); if(b)COVER_QUEUE.push(b);
  });
  pumpCovers();
}

function syncLock(){document.body.classList.toggle("lock",!$("detail").hidden||!$("basketOv").hidden||!$("readerOv").hidden)}
function refresh(){renderList();renderBadge();if(!$("detail").hidden)renderDetail();if(!$("basketOv").hidden)renderBasket();if(!$("readerOv").hidden)renderReader();syncLock();loadRealCovers()}

document.addEventListener("click",e=>{
  const el=e.target.closest("button,a");if(!el)return;
  const d=el.dataset;
  if(d.open){S.detail=+d.open;renderDetail();syncLock();loadRealCovers();return}
  if(d.add){const id=+d.add,i=S.basket.indexOf(id);if(i<0)S.basket.push(id);else S.basket.splice(i,1);S.copied=false;refresh();return}
  if(d.rm){S.basket=S.basket.filter(x=>x!==+d.rm);refresh();return}
  if(d.read){S.reader=+d.read;renderReader();syncLock();return}
  if(d.ed){S.ed[S.detail]=d.ed;renderDetail();renderList();return}
  if(d.cat){S.cat=d.cat;applyText();renderList();return}
  if(d.close){
    if(d.close==="detail"){S.detail=null;$("detail").hidden=true}
    if(d.close==="basketOv")$("basketOv").hidden=true;
    if(d.close==="readerOv"){S.reader=null;$("readerOv").hidden=true}
    syncLock();return;
  }
  if(d.rs){S.rs=Math.min(30,Math.max(14,S.rs+(+d.rs)*2));renderReader();return}
  if(d.copy){
    const box=$("msgbox"),txt=box.value;
    const done=()=>{S.copied=true;renderBasket()};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>{box.select()})}else{box.select()}
    return;
  }
});

/* ---------- Fond animé : chiffres et signes № qui défilent, façon générique de film ---------- */
(function(){
  const cv=$("rain"),st=cv.parentElement,cx=cv.getContext("2d");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)");
  const G="0123456789012345678901234567№";
  const size=15,gap=26;
  let W=0,H=0,cols=[],c1="#0a6a4d",c2="#c98a0a",run=false,last=0,seen=true,timer=0;
  const rnd=()=>G[Math.floor(Math.random()*G.length)];
  function colors(){const s=getComputedStyle(document.documentElement);c1=s.getPropertyValue("--accent").trim()||c1;c2=s.getPropertyValue("--price").trim()||c2}
  function setup(){
    const r=st.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
    W=r.width;H=r.height;if(!W||!H)return;
    cv.width=Math.round(W*d);cv.height=Math.round(H*d);cv.style.width=W+"px";cv.style.height=H+"px";cx.setTransform(d,0,0,d,0,0);
    const rows=Math.ceil(H/size)+4;
    cols=Array.from({length:Math.ceil(W/gap)},(_,i)=>newCol(i*gap+8,rows,true));
    colors();draw();
  }
  function newCol(x,rows,first){
    return {x,rows,on:Math.random()<.62,head:first?Math.random()*rows:-Math.random()*24,sp:.07+Math.random()*.2,len:10+Math.floor(Math.random()*16),ch:Array.from({length:rows+4},rnd)};
  }
  function step(){
    for(let i=0;i<cols.length;i++){
      const c=cols[i];c.head+=c.sp;
      if(Math.random()<.03){c.ch[Math.floor(Math.random()*c.ch.length)]=rnd()}
      if(c.head-c.len>c.rows)cols[i]=newCol(c.x,c.rows,false);
    }
  }
  function draw(){
    cx.clearRect(0,0,W,H);
    cx.font="500 "+size+"px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace";
    cx.textBaseline="alphabetic";
    for(const c of cols){
      if(!c.on)continue;
      for(let k=0;k<c.len;k++){
        const row=Math.floor(c.head)-k;
        if(row<0||row>=c.ch.length)continue;
        cx.globalAlpha=Math.pow(1-k/c.len,2)*(k===0?.7:.42);
        cx.fillStyle=k===0?c2:c1;
        cx.fillText(c.ch[row],c.x,(row+1)*size);
      }
    }
    cx.globalAlpha=1;
  }
  function frame(t){
    if(!run)return;
    requestAnimationFrame(frame);
    if(t-last<34)return;
    last=t;step();draw();
  }
  function sync(){
    const want=seen&&!document.hidden&&!reduce.matches;
    if(want&&!run){run=true;requestAnimationFrame(frame)}
    else if(!want&&run){run=false}
  }
  if("ResizeObserver" in window){new ResizeObserver(()=>{clearTimeout(timer);timer=setTimeout(setup,120)}).observe(st)}else{window.addEventListener("resize",setup)}
  if("IntersectionObserver" in window){new IntersectionObserver(es=>{seen=es[0].isIntersecting;sync()}).observe(st)}
  document.addEventListener("visibilitychange",sync);
  reduce.addEventListener&&reduce.addEventListener("change",sync);
  const dm=matchMedia("(prefers-color-scheme: dark)");
  dm.addEventListener&&dm.addEventListener("change",()=>{colors();draw()});
  setup();sync();
})();
</script>
